name: Deploy to Cloudflare Workers

# ─────────────────────────────────────────────────────────────
# AUTHORITATIVE DEPLOYMENT PIPELINE (single source of truth).
#
# WHY THIS IS SELF-CONTAINED (NOT needs: [ci, security]):
#   Earlier versions declared `needs: [ci, security]`. GitHub Actions
#   `needs` can only reference JOBS IN THE SAME WORKFLOW FILE. `ci` and
#   `security` are separate files (CI, Secret Scan), so every run failed
#   at 0s with a workflow-file parse error — the recurring
#   "Deploy to Cloudflare Workers / deploy failed" with no job output.
#
#   On a push to main, ci.yml is skipped (branches-ignore: [main]), so the
#   deploy path previously ran NO test/typecheck gate at all. This workflow
#   now carries test, typecheck and secret-scan as its own jobs and deploy
#   requires ALL of them. A failed validation job blocks deployment by
#   construction — there is no independent deploy path that can bypass it.
#
#   For pull requests, ci.yml (test + typecheck) and security.yml (gitleaks)
#   remain the PR-time gates. On main, this workflow is authoritative.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  TYPECHECK_BASELINE_WORKERS: 218
  TYPECHECK_BASELINE_REPO: 33

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  #  GATE 1 — Tests (blocking)
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run worker test suite
        run: pnpm --filter @workspace/workers run test

  # ═══════════════════════════════════════════════════════════
  #  GATE 2 — Typecheck (ratchet)
  # ═══════════════════════════════════════════════════════════
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck — workers (API)
        run: |
          chmod +x scripts/typecheck-ratchet.sh
          scripts/typecheck-ratchet.sh \
            "workers" "${TYPECHECK_BASELINE_WORKERS}" "workers" \
            npx tsc --noEmit
      - name: Typecheck — libs and artifacts
        run: |
          chmod +x scripts/typecheck-ratchet.sh
          scripts/typecheck-ratchet.sh \
            "repo" "${TYPECHECK_BASELINE_REPO}" "." \
            pnpm run typecheck

  # ═══════════════════════════════════════════════════════════
  #  GATE 3 — Secret scan (blocking)
  # ═══════════════════════════════════════════════════════════
  # Uses the SAME pinned gitleaks-action + .gitleaks.toml as the PR-time
  # Secret Scan workflow, with the full repository history checked out so
  # committed secrets are not missed. Reviewed non-production residuals are
  # handled at the config level: the removed synthetic attack-harness key is
  # acknowledged by fingerprint in .gitleaksignore, and documentation that
  # deliberately shows detection patterns is allowlisted in .gitleaks.toml.
  # A full-history scan passes clean, so the gate behaves identically on a
  # push-to-main deploy and a manual workflow_dispatch run.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0   # full history available for git log --log-opts
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.8.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_CONFIG: ".gitleaks.toml"

  # ═══════════════════════════════════════════════════════════
  #  DEPLOY — runs ONLY after all three gates pass.
  # ═══════════════════════════════════════════════════════════
  deploy:
    needs: [test, typecheck, secret-scan]
    if: success()
    runs-on: ubuntu-latest
    steps:
      # ── 1. Source ──────────────────────────────────────────────────
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # ── 2. Toolchain ────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ── 3. Dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # ════════════════════════════════════════════════════════════════
      #  INTEGRITY GATES (pre-deployment)
      # ════════════════════════════════════════════════════════════════

      # ── 4. Repo Integrity Gate ──────────────────────────────────────
      - name: 🔒 Gate — Repository Integrity
        run: bash scripts/repo-integrity-check.sh
        env:
          CI: true

      # ── 5. Required Files Gate ──────────────────────────────────────
      - name: 🔒 Gate — Required Deployment Files
        run: bash scripts/required-files-check.sh

      # ── 6. Import Integrity Gate ────────────────────────────────────
      - name: 🔒 Gate — Import Resolution
        run: python3 scripts/import-integrity-check.py --project-root . --exclude artifacts/ lib/ hermes-website/ __tests__ workers/tests-epic0059/ workers/tests/ --allow-external

      # ════════════════════════════════════════════════════════════════
      #  BUILD
      # ════════════════════════════════════════════════════════════════

      # ── 7. Build Frontend ───────────────────────────────────────────
      - name: Build frontend
        # VITE_API_BASE is injected from a GitHub secret so the production
        # bundle calls the live API (api.agsynergy.ca), not the hardcoded
        # dev fallback. Never commit the value to the repo.
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm --filter @workspace/ags-fertility run build

      # ── 8. Production Bundle Guard ──────────────────────────────────
      # Fail-closed regression gate: the 2026-07-28 incident shipped a bundle
      # that POSTed to the dead dev worker (agsynergy-api.kumarlogan.workers.dev)
      # because .env is gitignored and VITE_API_BASE was never injected. This
      # step blocks any build that references a dev/staging host and requires
      # the configured production host to actually be present in the bundle.
      - name: 🔒 Guard — Production bundle must not call dev/staging endpoints
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          shopt -s globstar nullglob
          FILES=(artifacts/ags-fertility/dist/public/assets/*.js)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No built JS bundles found under artifacts/ags-fertility/dist/public/assets/"
            exit 1
          fi
          # Negative check: no dev/staging endpoints allowed.
          BAD=$(grep -rEl 'kumarlogan\\.workers\\.dev|localhost:[0-9]+' "${FILES[@]}" 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "::error::Production bundle references a dev/staging endpoint:"
            grep -oE 'https?://[a-zA-Z0-9_.:/-]+' $BAD | sort -u | sed 's/^/  found: /'
            exit 1
          fi
          # Positive check: the configured production host must be present.
          PROD_HOST="${VITE_API_BASE%/}"
          if ! grep -rqF "$PROD_HOST" "${FILES[@]}" 2>/dev/null; then
            echo "::error::VITE_API_BASE ($PROD_HOST) not found in production bundle."
            exit 1
          fi
          echo "OK: bundle points at $PROD_HOST and contains no dev/staging endpoints."

      # ════════════════════════════════════════════════════════════════
      #  DEPLOY
      # ════════════════════════════════════════════════════════════════

      # ── 9. Inject JWT + Email config + Deploy API Worker ─────────────────
      # FIX (Phase 2 Stabilization): the previous pipeline only
      # deployed the frontend worker (hermes-website) from the repo
      # root and never deployed the API worker. The API lives in
      # /workers and its production route (api.agsynergy.ca) is
      # defined under env.production, so it REQUIRES --env production.
      # Inject JWT signing secrets and email config into the API worker
      # config at deploy time. Private keys stay in GitHub Secrets —
      # NEVER committed to the repo. Vars are injected here (not stored
      # in wrangler.jsonc) to ensure deterministic, repeatable deployments.
      # Subsequent manual `wrangler secret put` or local deploys that
      # skip this injection step will wipe these vars — always redeploy
      # through CI to preserve them.
      - name: Inject JWT + email config (API worker)
        working-directory: workers
        run: |
          node -e '
            const fs = require("fs");
            const f = "wrangler.jsonc";
            let s = fs.readFileSync(f, "utf8");
            // Strip JSONC // comments WITHOUT breaking URLs (https://, etc.).
            // Only strip a // that is preceded by whitespace or start-of-line
            // and not part of a :// scheme.
            const json = JSON.parse(
              s.replace(/((?:^|\s)\/\/.*$)/gm, "")
            );
            const v = (json.env.production.vars = json.env.production.vars || {});
            v.JWT_PRIVATE_KEY = process.env.JWT_PRIVATE_KEY;
            v.JWT_PUBLIC_KEY  = process.env.JWT_PUBLIC_KEY;
            v.JWT_KID         = process.env.JWT_KID;
            v.PLATFORM_JWT_PUBLIC_KEY = process.env.JWT_PUBLIC_KEY;
            v.PLATFORM_JWT_KID        = process.env.JWT_KID;
            v.TURNSTILE_SECRET_KEY = process.env.TURNSTILE_SECRET_KEY;
            v.EMAIL_FROM = process.env.EMAIL_FROM;
            v.RESEND_API_KEY = process.env.RESEND_API_KEY;
            v.APP_URL    = process.env.APP_URL;
            fs.writeFileSync(f, JSON.stringify(json, null, 2) + "\n");
            console.log("Injected JWT + email config vars (private key length=" + (process.env.JWT_PRIVATE_KEY ? process.env.JWT_PRIVATE_KEY.length : 0) + ")");
          '
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_KID: ${{ secrets.JWT_KID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}

      - name: Deploy API (agsynergy-api → api.agsynergy.ca)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.4.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: deploy --env production

      # ── 10. Deploy Frontend Worker ──────────────────────────────────
      # Root wrangler.jsonc is hermes-website (agsynergy.ca /
      # www.agsynergy.ca). Deployed from repo root, no env needed.
      - name: Deploy Frontend (hermes-website → agsynergy.ca)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.4.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # ── 11. Deploy API to Preview (Wave 4 — Care Companion) ──
      - name: Deploy API Preview (agsynergy-api → preview)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.4.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: deploy --env preview
