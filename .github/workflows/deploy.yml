name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build frontend
        # VITE_API_BASE is injected from a GitHub secret so the production
        # bundle calls the live API (api.agsynergy.ca), not the hardcoded
        # dev fallback. Never commit the value to the repo.
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm --filter @workspace/ags-fertility run build

      # ── API Worker ──────────────────────────────────────────────
      # FIX (Phase 2 Stabilization): the previous pipeline only
      # deployed the frontend worker (hermes-website) from the repo
      # root and never deployed the API worker. The API lives in
      # /workers and its production route (api.agsynergy.ca) is
      # defined under env.production, so it REQUIRES --env production.
      # Inject JWT signing secrets into the API worker config at deploy time.
      # Private key stays in GitHub Secrets — NEVER committed to the repo.
      - name: Inject JWT config (API worker)
        working-directory: workers
        run: |
          node -e '
            const fs = require("fs");
            const f = "wrangler.jsonc";
            let s = fs.readFileSync(f, "utf8");
            // Strip JSONC // comments WITHOUT breaking URLs (https://, etc.).
            // Only strip a // that is preceded by whitespace or start-of-line
            // and not part of a :// scheme.
            const json = JSON.parse(
              s.replace(/((?:^|\s)\/\/.*$)/gm, "")
            );
            const v = (json.env.production.vars = json.env.production.vars || {});
            v.JWT_PRIVATE_KEY = process.env.JWT_PRIVATE_KEY;
            v.JWT_PUBLIC_KEY  = process.env.JWT_PUBLIC_KEY;
            v.JWT_KID         = process.env.JWT_KID;
            v.PLATFORM_JWT_PUBLIC_KEY = process.env.JWT_PUBLIC_KEY;
            v.PLATFORM_JWT_KID        = process.env.JWT_KID;
            fs.writeFileSync(f, JSON.stringify(json, null, 2) + "\n");
            console.log("Injected JWT vars (private key length=" + process.env.JWT_PRIVATE_KEY.length + ")");
          '
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_KID: ${{ secrets.JWT_KID }}

      - name: Deploy API (agsynergy-api → api.agsynergy.ca)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: deploy --env production

      # ── Frontend Worker ─────────────────────────────────────────
      # Root wrangler.jsonc is hermes-website (agsynergy.ca /
      # www.agsynergy.ca). Deployed from repo root, no env needed.
      - name: Deploy Frontend (hermes-website → agsynergy.ca)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
