name: Phase M Edge Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      PROD_JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      PROD_JWT_KID: ${{ secrets.JWT_KID }}
      PROD_API_BASE: https://api.agsynergy.ca
      CF_ZONE_ID: 79eb19fb6005f9b53231965413af44fd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Capture pre-rule state (rulesets)
        run: |
          echo "=== Pre-rule: Rulesets ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/rulesets', headers=h)
          print(json.dumps(r.json(), indent=2))
          "

      - name: Capture pre-rule state (lockdowns)
        run: |
          echo "=== Pre-rule: Firewall Lockdowns ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/firewall/lockdowns', headers=h)
          print(json.dumps(r.json(), indent=2))
          "

      - name: Capture pre-rule state (firewall rules)
        run: |
          echo "=== Pre-rule: Firewall Rules ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/firewall/rules', headers=h)
          print(json.dumps(r.json(), indent=2))
          "

      - name: Capture pre-rule state (zone settings)
        run: |
          echo "=== Pre-rule: Zone Settings ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/settings', headers=h)
          print(json.dumps(r.json(), indent=2))
          "

      - name: Capture pre-rule state (WAF packages)
        run: |
          echo "=== Pre-rule: WAF Packages ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/firewall/waf/packages', headers=h)
          print(json.dumps(r.json(), indent=2))
          "

      - name: Apply Phase M WAF skip rule
        run: python3 scripts/configure-cloudflare-waf-exemption.py

      - name: Capture post-rule state (rulesets)
        run: |
          echo "=== Post-rule: Rulesets ==="
          python3 -c "
          import requests, os, json
          t = os.environ['CLOUDFLARE_API_TOKEN']
          z = os.environ['CF_ZONE_ID']
          h = {'Authorization': f'Bearer {t}', 'Content-Type': 'application/json'}
          r = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/rulesets', headers=h)
          print(json.dumps(r.json(), indent=2))
          # Also list rules in the WAF managed phase ruleset
          rulesets = r.json().get('result', [])
          for rs in rulesets:
              if rs.get('phase') == 'http_request_firewall_managed':
                  print(f'Ruleset ID: {rs[\"id\"]}')
                  r2 = requests.get(f'https://api.cloudflare.com/client/v4/zones/{z}/rulesets/{rs[\"id\"]}/rules', headers=h)
                  print(json.dumps(r2.json(), indent=2))
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: cd workers && pnpm install --frozen-lockfile=false

      - name: Run Phase M production replay
        working-directory: workers
        run: npx vitest run --config vitest.replay.config.ts --reporter=verbose
