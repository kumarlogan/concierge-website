name: Secret Scan

# ─────────────────────────────────────────────────────────────
# PR-time secret scanning gate.
#
# On pull requests this workflow scans for leaked secrets and blocks
# merge until clean. On a push to main, the authoritative Deploy
# workflow (deploy.yml) runs its own Secret Scan job as a deployment
# gate — so this workflow is intentionally PR-only to avoid running
# gitleaks twice on the same main commit (single source of truth).
# ─────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0   # full history so gitleaks can scan committed secrets
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.8.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Fail the pipeline on ANY finding. Blocks merge/deploy until clean.
          GITLEAKS_CONFIG: ".gitleaks.toml"