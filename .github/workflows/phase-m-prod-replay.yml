name: Phase M Production Replay

on:
  workflow_dispatch:
    # Manual trigger. Runs the literal Phase M cross-patient consent attack matrix
    # against the LIVE production API using the production signing key
    # (injected as a secret — never committed to the repo).

permissions:
  contents: read

jobs:
  prod-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      PROD_JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      PROD_JWT_KID: ${{ secrets.JWT_KID }}
      PROD_API_BASE: https://api.agsynergy.ca
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: uses package.json "packageManager" (pnpm@11.13.1).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Phase M production replay (literal token/session attack on live API)
        working-directory: workers
        run: npx vitest run --config vitest.replay.config.ts --reporter=verbose