name: Apply D1 Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list pending migrations without applying)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: List pending migrations
        working-directory: workers
        run: npx wrangler d1 migrations list agsynergy-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply migrations
        if: inputs.dry_run == 'false'
        working-directory: workers
        run: npx wrangler d1 migrations apply agsynergy-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}