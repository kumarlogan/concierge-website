build_and_deploy:
  package_manager: pnpm 11.13.1 (pinned via packageManager field)
  node_versions:
    ci_and_pinfile: "22 (.node-version file, deploy.yml NODE_VERSION: 22)"
    replit_runtime: "24 (.replit modules: nodejs-24)"
    mismatch_risk: >
      CI builds with Node 22; Replit dev environment uses Node 24. Behavior
      differences (e.g. built-in fetch, crypto APIs) could cause issues that
      only surface in one environment.
    evidence: .node-version, .replit, .github/workflows/deploy.yml
    confidence: observed

  build_commands:
    typecheck_all: "pnpm run typecheck"
    build_spa: "pnpm --filter @workspace/ags-fertility run build"
    build_root: "pnpm run build  # runs typecheck then SPA build"
    deploy_api: "pnpm --filter @workspace/workers run deploy  # runs extract-version.sh then wrangler deploy"

  deploy_trigger: push to main branch OR workflow_dispatch
  deploy_workflow: .github/workflows/deploy.yml
  deploy_environments:
    production_api: "wrangler deploy --env production (agsynergy-api)"
    frontend: "wrangler deploy (hermes-website, root wrangler.jsonc)"
    preview_api: "Only on workflow_dispatch on main; deploys --env preview"
  auto_deploy: true  # no manual approval gate; merge to main immediately deploys both workers

  pre_deploy_checks_that_exist:
    - name: Repo Integrity
      script: scripts/repo-integrity-check.sh
      what: Checks clean working tree, correct branch, synced with remote

    - name: Required Files
      script: scripts/required-files-check.sh
      what: Verifies required deployment files exist

    - name: Import Resolution
      script: "python3 scripts/import-integrity-check.py"
      what: >
        Static import graph analysis. Excludes: artifacts/, lib/, hermes-website/,
        __tests__, workers/tests-epic0059/, workers/tests/. Resolves @hermes/* and
        @shared/* aliases. Detects unresolvable imports.

    - name: Production Bundle Guard
      step: CI step 9 in deploy.yml
      what: >
        Fails if built JS references kumarlogan.workers.dev or localhost:*.
        Also fails if VITE_API_BASE host is NOT present in bundle (regression
        guard added 2026-07-28 after incident where missing var caused silent
        origin fallback).

  gates_that_do_not_exist:
    - tests: "No vitest step in deploy.yml — tests are NOT run as part of deploy pipeline"
    - typecheck: "No tsc step in deploy.yml — TypeScript errors do not block deployment"
    - lint: "No ESLint or Prettier-check step in any workflow"
    - dependabot: "No dependabot.yml — no automated dependency updates"
    - branch_protection: "No CODEOWNERS file; branch protection rules unknown (configured at GitHub repo settings level)"

  evidence: .github/workflows/deploy.yml, A_build_cicd_testing.md (sections 3-4)
  confidence: observed

