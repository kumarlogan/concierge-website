# ---------------------------------------------------------------------------
data_layer:
  mechanism: Forward-only SQL migration files (no rollback migrations)
  migration_directory: workers/migrations/
  migration_count: 12  # 0001 through 011 (two files named 0002_*, one file named 011_ missing leading zero)
  table_count: 68  # total distinct tables across all migrations
  application_method: >
    wrangler d1 migrations apply (Wrangler CLI standard). Wrangler manages
    migration state internally via d1_migrations meta-table. No CI/CD migration
    pipeline found — assumed manual: wrangler d1 migrations apply agsynergy-db --env production.
  primary_database: "DB (agsynergy-db, id: 45f52102-74e1-4ba2-86ca-f4d5f88e16c4)"
  secondary_database: "NOTIFICATIONS (agsynergy-notifications, unprovisioned — database_id empty)"

  schema_issues:
    - issue: Duplicate 0002_ prefix
      detail: Both 0002_identity_core.sql and 0002_rbac_foundation.sql exist; application order is undefined
      severity: HIGH
      evidence: workers/migrations/

    - issue: consents table defined twice with incompatible schemas
      detail: >
        0006_trust_runtime.sql and 0008_consent_engine.sql both issue
        CREATE TABLE IF NOT EXISTS consents with different columns. Second
        definition is silently skipped (IF NOT EXISTS). 0008 adds patient_identity_id,
        status, resource_type, resource_id, revoked_by, revoke_reason, updated_at —
        these columns are absent from the live table if 0006 ran first.
      severity: CRITICAL
      evidence: E_data_layer.md (section 1, migration 0008 note)

    - issue: "011_notifications.sql filename missing leading zero"
      detail: Breaks the 0NNN_ naming scheme; sorting ambiguity
      severity: MEDIUM

    - issue: Workflow engine timestamps use INTEGER (epoch ms) not TEXT ISO-8601
      detail: Inconsistent with all prior migrations which use TEXT ISO-8601
      severity: LOW
      evidence: workers/migrations/0010_workflow_engine.sql

  source_of_truth: workers/migrations/  # Do not enumerate all 68 tables here; read migration files directly

  table_groups:
    core_crm:
      table_count: 6
      migration: 0001_initial_schema.sql
      purpose: leads, contacts, clinics, consultations, services, faqs (CRM foundation)
      note: faqs and services tables have no confirmed TS code consumers — likely dead schema

    identity_core:
      table_count: 12
      migration: 0002_identity_core.sql
      purpose: >
        Platform-wide identity: identities, identity_sessions, identity_credentials,
        refresh_tokens, email_verifications, password_resets, oauth_accounts,
        identity_providers, identity_events, identity_audit, trust_snapshots, consent_snapshots

    rbac_foundation:
      table_count: 5  # + 1 from migration 0004
      migrations: [0002_rbac_foundation.sql, 0004_role_permissions_seed.sql]
      purpose: roles, permissions, users, user_permissions, audit_logs, role_permissions
      note: >
        users (ops staff) and identities (platform auth) are DISTINCT tables serving
        different purposes.

    workforce_and_internal_workflow:
      table_count: 9
      migration: 0005_workforce_persistence.sql
      purpose: >
        workforce_agents, agent_activation_requests, agent_audit_events,
        workforce_metrics, workflows, workflow_tasks, workflow_approvals,
        workflow_granted_approvals, workforce_workflow_metrics

    trust_runtime:
      table_count: 13
      migration: 0006_trust_runtime.sql
      purpose: >
        policies, policy_versions, consents (schema conflict with 0008),
        consent_versions, trust_scores, trust_history, delegations,
        authorization_decisions, decision_audit, risk_events,
        policy_registry, consent_registry, trust_registry
      note: ConsentEngine and DelegationEngine do NOT read/write these tables — use in-memory Maps

    documents:
      table_count: 5
      migration: 0007_document_upload.sql
      purpose: documents, document_shares, document_access_log, document_encryption_keys, caregiver_authorizations

    consent_engine:
      table_count: 1  # consents is a no-op due to schema conflict; consent_history is new
      migration: 0008_consent_engine.sql
      purpose: consent_history (consents CREATE IF NOT EXISTS is silently skipped if 0006 ran first)

    was_activation:
      table_count: 1
      migration: 0009_was_activation_state_persistence.sql
      purpose: was_activation_state (WAS state machine persistence — disabled by default in code)

    workflow_engine:
      table_count: 11
      migration: 0010_workflow_engine.sql
      purpose: >
        workflow_instances, task_instances, approval_gates, workflow_timers,
        workflow_events, task_queue, workflow_dlq, workflow_templates,
        workflow_analytics_daily, workflow_analytics_weekly, workflow_overrides

    notifications:
      table_count: 5
      migration: 011_notifications.sql
      purpose: notifications, notification_delivery, notification_escalation, notification_analytics, notification_preferences

  evidence: E_data_layer.md (sections 1-3)
  confidence: observed

