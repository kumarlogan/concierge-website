testing:
  framework: Vitest
  config_files:
    - path: vitest.config.ts  # repo root
      scope: All workspaces (**/*.test.ts)
      environment: node
      aliases: "@hermes -> ./hermes, @shared -> ./shared"
      excludes_custom_runners:
        - hermes/services/workforce/d1-backend.test.ts
        - hermes/services/execution/gateway/__tests__/approval.regression.test.ts
        - hermes/services/providers/trust/__tests__/trust.regression.test.ts
        - hermes/services/activation/providers/deployment/__tests__/epic007.launch.test.ts
      excludes_cf_pool:
        - workers/tests/auth/engine.integration.test.ts
        - workers/tests/integration/api.test.ts
        - workers/tests/ops/ops.integration.test.ts
        - workers/tests/telegram/bot.integration.test.ts

    - path: workers/vitest.config.ts
      scope: workers/tests/**/*.test.ts
      pool: "@cloudflare/vitest-pool-workers (Miniflare — runs inside Workers runtime)"
      global_setup: workers/tests/globalSetup.ts  # applies D1 migrations before tests
      d1_persistence: .wrangler/state/v3/d1
      excludes:
        - tests/workforce-persistence.test.ts  # uses renameSync, fails under CF pool
        - tests/workforce-activation.test.ts   # same reason
        - tests-epic0059/p1-smoke.test.ts      # custom runner
        - tests/launch/smoke-tests.test.ts     # requires live deployment (SMOKE_TEST_URL)

    - path: workers/vitest.epic005.config.ts
      scope: >
        hermes/services/providers/**/*.test.ts,
        hermes/services/activation/**/*.test.ts,
        hermes/services/execution/**/*.test.ts,
        hermes/audit/**/*.test.ts
      pool: threads
      environment: node
      purpose: Pure Node unit tests for EPIC-005.9 regression suite

  test_file_count: 68  # total .test.ts files found
  distribution:
    workers_tests_flat: 30  # directly in workers/tests/
    workers_tests_subdirs: "~20 (admin/, auth/, consultation/, health/, integration/, launch/, ops/, platform/, runtime/, telegram/)"
    workers_src_colocated: 5  # workers/src/platform/notifications/ and workflow/
    hermes_services: "~14 (providers/__tests__/, execution/gateway/__tests__/, activation/...)"
    workers_tests_epic0059: 1

  what_is_covered:
    - Cloudflare Worker API endpoints (HTTP integration tests)
    - D1 store operations (with Miniflare D1)
    - Workforce / agent orchestration
    - Security hardening
    - Admin APIs
    - Platform APIs (notification, workflow, identity, consultation, documents, appointments)
    - Hermes service unit tests (EPIC-003 through EPIC-007)

  what_is_not_covered:
    - Frontend (artifacts/ags-fertility) has ZERO test files
    - No coverage thresholds configured in any vitest config
    - Tests are NOT run in the deploy pipeline (CI deploys without running vitest)
    - No E2E tests (smoke-tests.test.ts requires live SMOKE_TEST_URL — excluded from CI)

  coverage:
    script: "pnpm --filter @workspace/workers run test:coverage  # vitest run --coverage"
    thresholds: none  # not enforced
    ci_enforced: false

  evidence: A_build_cicd_testing.md (section 5)
  confidence: observed

