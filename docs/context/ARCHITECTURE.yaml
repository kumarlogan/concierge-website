# ---------------------------------------------------------------------------
system:
  name: AGS Fertility Concierge (Hermes Platform)
  purpose: >
    Patient-facing fertility concierge web application (AGS Fertility / AG Synergy),
    with an AI workforce control plane (Hermes) and a multi-subsystem Cloudflare
    Worker API backend.
  public_brand: AG Synergy
  domains:
    - agsynergy.ca
    - www.agsynergy.ca
    - api.agsynergy.ca
  hosting_platform: Cloudflare Workers + Cloudflare R2
  development_platform: Replit (nodejs-24 runtime)
  evidence: wrangler.jsonc, workers/wrangler.jsonc, .replit
  confidence: observed

# ---------------------------------------------------------------------------
runtime_topology:
  workers:
    - name: hermes-website
      wrangler_config: wrangler.jsonc  # repo root
      source_dir: artifacts/ags-fertility/dist/public  # build output served as assets
      domains:
        - agsynergy.ca
        - www.agsynergy.ca
      routes:
        - pattern: agsynergy.ca
          custom_domain: true
        - pattern: www.agsynergy.ca
          custom_domain: true
      purpose: >
        Static-asset SPA worker. Serves the built React SPA with
        single-page-application not_found_handling. No bindings, no business logic.
      bindings: []
      compatibility_date: "2026-07-17"
      note: >
        Worker name "hermes-website" is misleading — this worker serves the
        ags-fertility React SPA, not a separate "hermes" frontend.
      evidence: wrangler.jsonc
      confidence: observed

    - name: agsynergy-api
      wrangler_config: workers/wrangler.jsonc
      source_dir: workers/src
      entrypoint: workers/src/index.ts
      domains:
        - api.agsynergy.ca  # production env route
        - agsynergy-api.kumarlogan.workers.dev  # workers_dev fallback
      routes:
        production:
          pattern: api.agsynergy.ca
          custom_domain: true
        preview:
          pattern: null  # no route defined for preview env
      purpose: >
        Primary API backend. Cloudflare Worker implementing the full AGS platform:
        patient identity, trust/consent/policy runtime, document management,
        appointments, messaging, notifications, workflows, operations, and
        two Telegram bot webhooks.
      compatibility_date: "2026-07-17"
      compatibility_flags:
        - nodejs_compat
      observability: enabled  # wrangler built-in observability
      version: 1.1.0  # workers/src/version.ts
      evidence: workers/wrangler.jsonc, workers/src/index.ts, workers/src/version.ts
      confidence: observed

  spa:
    name: ags-fertility
    package: "@workspace/ags-fertility"
    source_dir: artifacts/ags-fertility
    build_output: artifacts/ags-fertility/dist/public
    deployed_via: hermes-website worker (static assets)
    evidence: wrangler.jsonc (assets.directory), artifacts/ags-fertility/package.json
    confidence: observed

