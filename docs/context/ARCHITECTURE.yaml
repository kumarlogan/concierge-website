frontend:
  package: "@workspace/ags-fertility"
  source_dir: artifacts/ags-fertility/
  build_output: artifacts/ags-fertility/dist/public/
  stack:
    framework: React 18
    build_tool: Vite (with @vitejs/plugin-react)
    language: TypeScript + TSX
    styling: Tailwind CSS v4 (via @tailwindcss/vite plugin; no tailwind.config.js)
    component_system: shadcn/ui pattern (40+ Radix UI primitives wrapped in src/components/ui/)
    icons: lucide-react, react-icons
    animation: framer-motion, tw-animate-css
    charts: recharts
    date_picker: react-day-picker
    carousel: embla-carousel-react
    theme: next-themes (dark/light mode)
    toast: sonner
  router:
    library: wouter v3
    base_path: import.meta.env.BASE_URL (configurable via BASE_PATH env var at build time)
    pattern: SPA with not_found_handling=single-page-application on the worker
  state_management:
    server_state: "@tanstack/react-query (QueryClient initialized in App.tsx)"
    auth_state: Custom React context (AuthProvider/useAuth in lib/auth-context.tsx)
    global_client_state: none  # no Redux, Zustand, or Jotai observed
    form_handling: react-hook-form + @hookform/resolvers + zod
  page_count: "~40 pages (16 public/marketing + 18 auth-guarded patient + 6 clinic)"
  auth_token_storage:
    mechanism: localStorage
    keys:
      access_token: ags_patient_access_token
      refresh_token: ags_patient_refresh_token
    risk: >
      Tokens in localStorage are vulnerable to XSS. No HttpOnly cookie approach
      observed. Refresh triggered on 401 via tryRefreshToken() in auth-context.
    evidence: artifacts/ags-fertility/src/lib/patient-api.ts
    confidence: observed
  api_base:
    patient_api: "import.meta.env.VITE_API_BASE || 'https://api.agsynergy.ca'"
    document_api: "/api/v1 (hardcoded relative)"
    appointment_api: "import.meta.env.VITE_API_BASE ?? '' (falls back to relative)"
    note: >
      Inconsistent API base URL handling across API client files. document-api.ts
      uses hardcoded relative path; appointment-api.ts falls back to empty string.
      The 2026-07-28 incident: missing VITE_API_BASE silently posted to SPA origin.
    evidence: artifacts/ags-fertility/src/lib/patient-api.ts, D_frontend.md (section 4)
    confidence: observed
  dev_proxy:
    paths: [/identity, /api]
    target: "http://localhost:8787 (local Wrangler dev port)"
    evidence: artifacts/ags-fertility/vite.config.ts
    confidence: observed
  clinic_auth_gap:
    description: >
      All /clinic/* routes use ClinicLayout but have NO AuthGuard wrapper.
      Patient workspace routes all have AuthGuard. Clinic workspace is
      unauthenticated at the router level.
    severity: HIGH
    evidence: artifacts/ags-fertility/src/App.tsx, D_frontend.md (section 2)
    confidence: observed
  tests: none  # zero test files in artifacts/ags-fertility/

