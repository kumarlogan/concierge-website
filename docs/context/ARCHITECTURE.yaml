# ---------------------------------------------------------------------------
dependency_direction:
  rule: workers/ imports from hermes/ (NOT the reverse)
  allowed:
    - from: workers/
      to: hermes/
      mechanism: "@hermes/* path alias (tsconfig + wrangler aliases)"
    - from: workers/
      to: shared/
      mechanism: "@shared/* path alias (tsconfig alias)"
    - from: hermes/
      to: shared/
      mechanism: "relative imports (../../shared/contracts/*)"
    - from: artifacts/ags-fertility/
      to: lib/api-client-react/
      mechanism: "pnpm workspace: @workspace/api-client-react"

  path_aliases:
    - alias: "@hermes/*"
      target: hermes/*
      defined_in:
        - workers/tsconfig.json  # TypeScript resolution
        - workers/wrangler.jsonc  # Wrangler bundler (explicit .js→.ts remapping)
      note: >
        Wrangler aliases use explicit .js→.ts remapping for ESM convention.
        @hermes/permissions/middleware.js is NOT explicitly listed in wrangler.jsonc
        aliases — covered only by the directory-level @hermes alias, which may
        cause bundler resolution issues.
      evidence: workers/tsconfig.json, workers/wrangler.jsonc
      confidence: observed

    - alias: "@shared/*"
      target: shared/*
      defined_in:
        - workers/tsconfig.json
        - workers/wrangler.jsonc
      note: >
        Actual @shared/* usage in workers/ source is sparse — only 1 test file
        confirmed (workers/tests/epic-004-tenant-boundary.test.ts). hermes/ uses
        relative imports (../../shared/*) instead of the alias.
      evidence: workers/tsconfig.json, F_shared_libraries.md (section 5)
      confidence: observed

    - alias: "@workspace/*"
      target: pnpm workspace packages
      mechanism: pnpm workspace protocol (workspace:*)
      defined_in: each package's package.json dependencies
      evidence: artifacts/ags-fertility/package.json
      confidence: observed

  known_risks:
    - id: EPIC-007-circular-dependency
      description: >
        hermes/EPIC-007-plan.md describes hermes/services/execution/ as depending
        on workers/src/platform/epcl/ and workers/src/platform/was/. If this
        dependency is implemented, hermes/ → workers/ imports would coexist with
        workers/ → hermes/ imports, creating a circular dependency. The import
        integrity check (scripts/import-integrity-check.py) runs in CI but excludes
        workers/tests directories — it is unclear whether a hermes→workers import
        would be detected. As of 2026-08-04 the actual import code has not been
        confirmed (plan exists, implementation status unknown).
      severity: HIGH
      evidence: hermes/EPIC-007-plan.md, F_shared_libraries.md (section 6)
      confidence: inferred

# ---------------------------------------------------------------------------
request_lifecycle:
  worker: agsynergy-api
  source: workers/src/index.ts
  ordered_steps:
    - step: 1
      name: createSafeD1
      file: workers/src/platform/d1.ts
      description: Wraps env.DB in a Proxy that coerces undefined→null on .bind() calls. P0 production fix.

    - step: 2
      name: wirePlatformEngines
      file: workers/src/index.ts (inline)
      description: >
        Injects ConsentEngine, TrustEngine, PolicyEngine, RiskEngine,
        DelegationEngine, DecisionEngine, EventBus, DocumentService as
        module-level singletons into env. Constructed once per Worker isolate.

    - step: 3
      name: request.start log
      file: workers/src/middleware/logger.ts
      description: Structured JSON log of {method, path}.

    - step: 4
      name: rateLimit
      file: workers/src/middleware/rateLimit.ts
      description: >
        Per-IP sliding window (default 60 req/60s). State in module-level Map
        — per-isolate only, not globally distributed. On exceed: 429 + Retry-After.

    - step: 5
      name: CORS preflight
      file: workers/src/index.ts (inline)
      description: >
        OPTIONS → 204 with CORS headers. Allowed origins: agsynergy.ca,
        www.agsynergy.ca, localhost:5173, localhost:23815.

    - step: 6
      name: router.fetch
      file: workers/src/router/index.ts
      description: >
        Custom zero-dependency URLPattern router. First match wins. Wraps each
        handler in try/catch (500 on unhandled error). Unmatched → 404 JSON.

    - step: 7
      name: CORS response headers
      file: workers/src/index.ts (inline)
      description: Appends Access-Control-Allow-Origin, Vary:Origin, method/header allow lists.

    - step: 8
      name: rate-limit response headers
      file: workers/src/index.ts (inline)
      description: Appends X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After.

    - step: 9
      name: applySecurityHeaders
      file: workers/src/middleware/security-headers.ts
      description: >
        HSTS (max-age=31536000 + includeSubDomains + preload), CSP, X-Frame-Options
        (DENY), X-Content-Type-Options (nosniff), Referrer-Policy, Permissions-Policy,
        Cache-Control (no-store). Strips Server and X-Powered-By.

    - step: 10
      name: request.complete log
      file: workers/src/middleware/logger.ts
      description: Structured JSON log of {method, path, status, latencyMs}.

  route_level_middleware:
    - name: requirePermission
      file: "@hermes/permissions/middleware"
      applied_to: All /api/v1/ops/* routes; Telegram and admin bot command dispatch
      returns: "{authorized, principal:{userId,roleName,permissions}, response}"

    - name: withJwtAuth
      file: workers/src/middleware/jwt-auth.ts
      applied_to: >
        All /api/v1/timeline/*, /api/v1/documents/*, /api/v1/caregiver/*,
        /api/v1/appointments/*, /api/v1/messages/*, /api/v1/notifications/*,
        /api/v1/workflows/*, /api/v1/tasks/*, /api/v1/queue/*, /api/v1/trust/*,
        /api/v1/consent/*, /api/v1/policy/*, /api/v1/delegation/*,
        /api/v1/authorization/*, /api/v1/policies, /api/v1/permissions,
        /api/v1/clinic/*, /api/v1/coordination/*
      algorithm: RS256
      issuers: ["ai-platform:identity-core", "ai-platform:concierge"]
      public_key_env: PLATFORM_JWT_PUBLIC_KEY

    - name: verifyTurnstile
      file: workers/src/middleware/turnstile.ts
      applied_to: POST /api/v1/consultations only
      note: Skipped if TURNSTILE_SECRET_KEY is absent (dev mode)

  evidence: workers/src/index.ts, B_worker_api_layer.md (section 3)
  confidence: observed

# ---------------------------------------------------------------------------
auth_model:
  paths:
    - id: A
      name: JWT Bearer (RS256)
      mechanism: >
        Authorization: Bearer <token> header. Verified via JwtManager.verify()
        using env.PLATFORM_JWT_PUBLIC_KEY. Claims: sub (identityId), identity_type,
        session_id, email, mfa_level, trust_score. On success: identity attached
        to request via x-authenticated-* headers.
      issuers:
        - ai-platform:identity-core
        - ai-platform:concierge
      where_enforced: >
        withJwtAuth() wrapper applied to ~90+ JWT-protected routes (all Wave 3+
        protected endpoints). Fails closed on any error; returns typed 401 codes.
      file: workers/src/middleware/jwt-auth.ts
      evidence: B_worker_api_layer.md (section 4.1A)
      confidence: observed

    - id: B
      name: Data-driven RBAC (Hermes permissions)
      mechanism: >
        requirePermission(db, request, permission) resolves identity from
        X-Telegram-Chat-Id / X-Telegram-Display-Name headers (Telegram bots)
        or from JWT (HTTP API). Returns OpsPrincipal (userId + roleName) attached
        to request via Symbol.for("agsynergy.principal").
      issuers: [hermes identity provider registry]
      where_enforced: All /api/v1/ops/* routes; Telegram and admin bot command dispatch
      permissions:
        ops_api: [leads.read, leads.update, leads.assign]
        admin_bot: [hermes:admin:read, hermes:admin:audit-read]
      file: "@hermes/permissions/middleware"
      evidence: B_worker_api_layer.md (section 4.1B, 4.2)
      confidence: observed

    - id: C
      name: Identity Platform (self-wiring)
      mechanism: >
        All /identity/* paths dispatched to IdentityRouter.route() which
        self-wires IdentityService, SessionManager, JwtManager, MagicLinkManager,
        OAuthService (Google/OIDC/SAML), MFAManager (TOTP). Handles registration,
        login, magic-link, OAuth, MFA, token refresh, credential rotation.
        JWT private key registered from env.JWT_PRIVATE_KEY at module init.
      issuers: [internal — issues ai-platform:identity-core tokens]
      where_enforced: GET and POST /identity/* catch-all routes in workers/src/index.ts
      backing_store: D1 (env.DB) via IdentityRepository
      file: workers/src/platform/identity/IdentityRouter  # (from platform/identity/)
      evidence: B_worker_api_layer.md (section 4.1C), C_platform_subsystems.md (section 5)
      confidence: observed

  bot_auth:
    description: >
      Both Telegram webhooks check X-Telegram-Bot-Api-Secret-Token header
      against env.TELEGRAM_BOT_TOKEN (ops bot) or env.ADMIN_BOT_TOKEN (admin bot).
      If the env var is absent, the check is skipped (dev mode).
    evidence: workers/src/routes/telegram.ts, workers/src/routes/adminBot.ts
    confidence: observed

  known_defect:
    description: >
      AUTHORIZATION_ENGINE is declared in workers/src/types/env.ts and called
      by POST /api/v1/authorization/check and GET /api/v1/permissions, but is
      NEVER injected in wirePlatformEngines(). These two endpoints will throw
      TypeError at runtime. Documented in workers/src/index.ts as a known gap.
    affected_endpoints:
      - POST /api/v1/authorization/check
      - GET /api/v1/permissions
    evidence: workers/src/index.ts (lines ~130-140), B_worker_api_layer.md (section 8.1)
    confidence: observed

# ---------------------------------------------------------------------------
platform_subsystems:
  # All subsystems are under workers/src/platform/
  # Maturity values: production | partial | dormant | stub
  # http_exposed: whether live HTTP routes exist for this subsystem

  - name: Identity
    acronym: null
    purpose: >
      Full-stack authentication: registration, login, JWT issuance/verification,
      OAuth/OIDC/SAML SSO, MFA (TOTP), magic links, email verification,
      password reset, session management, refresh token rotation, credential rotation.
    maturity: production
    http_exposed: true
    routes: GET and POST /identity/* (catch-all)
    persistence: d1  # IdentityRepository writes to env.DB
    evidence: workers/src/platform/identity/IdentityRouter, C_platform_subsystems.md (section 5)
    confidence: observed

  - name: Trust
    acronym: Trust Runtime
    purpose: >
      Multi-engine authorization runtime: 6 singletons (TrustEngine, ConsentEngine,
      PolicyEngine, RiskEngine, DelegationEngine, DecisionEngine) plus EventBus.
      All trust factor scoreFns return hardcoded 0.5 (TrustLevel.MEDIUM) unless
      overridden. ConsentEngine and DelegationEngine use in-memory Maps despite
      D1 tables existing — data is lost on isolate restart.
    maturity: partial
    http_exposed: true
    routes: 11 routes via registerTrustRuntimeRoutes() (trust, consent, policy, delegation)
    persistence: in_memory  # engines use Maps; D1 tables exist but engines do not read/write them
    known_defects:
      - ConsentEngine uses Map despite consents D1 table — data lost on restart (CRITICAL)
      - DelegationEngine uses Maps despite delegations D1 table — data lost on restart (CRITICAL)
      - AUTHORIZATION_ENGINE not wired — /api/v1/authorization/check and /api/v1/permissions throw
      - All 10 trust factor scoreFns return hardcoded 0.5
    evidence: workers/src/platform/trust/, C_platform_subsystems.md (section 4)
    confidence: observed

  - name: Workflow
    acronym: Workflow and Automation Engine
    purpose: >
      Wave 8 IVF patient journey workflow engine: BPMN-like state machine over
      15+ JourneyState values, D1-backed event sourcing, task orchestration,
      approval gates, timer/escalation service, cron scheduler.
    maturity: production
    http_exposed: true
    routes: "30+ routes via registerWorkflowRoutes() in wave7.ts"
