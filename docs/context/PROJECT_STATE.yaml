# ---------------------------------------------------------------------------
what_this_is:
  summary: >-
    A pnpm monorepo containing a patient-facing fertility clinic web application
    (AG Synergy) built on Cloudflare Workers + D1 + R2, together with an ambitious
    AI engineering platform layer (Hermes) intended to plan and execute engineering
    work autonomously.
  two_tracks:
    - track: product
      description: >-
        The AGS Fertility Concierge patient portal and clinic console. This track is
        live in production and carries real functionality.
      status: operational
      confidence: observed
    - track: platform
      description: >-
        The Hermes AI workforce platform — EPCL planning, WAS activation, WEF
        execution, Trust Runtime, PSER project state. Extensively designed,
        substantially coded, and largely NOT reachable at runtime.
      status: largely_dormant
      confidence: observed
  critical_reader_note: >-
    The volume and confidence of documentation about the platform track is not
    proportional to how much of it executes. Treat platform documentation as design
    intent unless ARCHITECTURE.yaml marks the subsystem `production`.

