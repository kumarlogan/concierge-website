# Capability status. This is the section to read before believing any claim of
# completeness made elsewhere in the repository.
capabilities:
  implemented:
    - name: Identity and authentication
      detail: End-to-end auth with D1 backing, JWT (RS256) key management, magic link, OAuth/OIDC, MFA, password flows.
      evidence: workers/src/platform/identity/
      confidence: observed
    - name: Trust runtime
      detail: Six engines (trust scoring, consent, policy, risk, delegation, decision) wired to 11 JWT-gated routes.
      caveat: AUTHORIZATION_ENGINE is never constructed — see known_gaps.
      evidence: workers/src/platform/trust/
      confidence: observed
    - name: Workflow engine
      detail: D1-backed event-sourced engine with 30+ live routes covering task orchestration, approval gates, timers.
      evidence: workers/src/platform/workflow/
      confidence: observed
    - name: Document management
      detail: R2-backed storage with consent and policy integration.
      caveat: Document metadata is held in an in-process singleton, not D1.
      evidence: workers/src/platform/documents/
      confidence: observed
    - name: Patient portal frontend
      detail: React + Vite SPA, 35+ pages, patient and clinic workspaces, Waves 5-7 promoted to production.
      evidence: artifacts/ags-fertility/
      confidence: observed
    - name: Telegram operations surface
      detail: Webhook routes and admin bot for operating the site via Telegram.
      evidence: workers/src/routes/telegram.ts, workers/src/routes/adminBot.ts
      confidence: observed

  partially_implemented:
    - name: Notifications
      detail: D1 delivery-record store exists; actual FCM/SES/Twilio delivery is a simulated stub. Target D1 binding is unprovisioned.
      evidence: workers/src/platform/notifications/
      confidence: observed
    - name: Appointments
      detail: Fully routed but backed by an in-memory engine on globalThis. Data does not survive isolate recycle.
      evidence: workers/src/platform/appointments/
      confidence: observed
    - name: Messaging
      detail: Fully routed, in-memory only. No messages table exists in any migration.
      evidence: workers/src/platform/messaging/
      confidence: observed
    - name: Clinic console
      detail: Routes exist; several return hardcoded mock data. Auth guard missing (open PR #3 addresses this).
      evidence: workers/src/routes/clinic.ts, workers/src/routes/clinic-messages.ts
      confidence: observed

  built_but_dormant_note: >-
    Substantial, well-structured code with no runtime reachability. Not dead code —
    deliberately gated — but a reader must not assume it runs.
  built_but_dormant:
    - name: EPCL (Executive Planning and Control Layer)
      detail: Complete 12-stage planning workflow with rich types. No HTTP route. All feature flags default false.
      evidence: workers/src/platform/epcl/, workers/src/platform/epcl/feature-flags.ts
      confidence: observed
    - name: WAS (Workforce Activation Service)
      detail: Full 7-state activation machine with observability and duplicate protection. No HTTP route. Flags default false.
      evidence: workers/src/platform/was/
      confidence: observed
    - name: WEF (Workforce Execution Framework)
      detail: No execution engine exists. WEFDelegator carries an explicit TODO stating delegation returns simulated success only.
      evidence: workers/src/platform/was/wef-delegator.ts
      confidence: observed
    - name: Timeline, Providers, Credentials, Release
      detail: In-memory, no D1 backing, no HTTP exposure.
      confidence: observed
  dormant_flag_count: 11
  dormant_summary: >-
    The EPCL -> WAS -> WEF pipeline, described across the documentation corpus as the
    core of the AI platform, is entirely unreachable in production. WAVE2_AUDIT_REPORT.md
    independently confirms the certified orchestration path was never invoked; that
    wave was delivered as a direct coding task instead.

  missing:
    - name: Automated quality gate in CI
      detail: No test run and no typecheck in the deploy pipeline.
      confidence: observed
    - name: Frontend test coverage
      detail: Zero tests in artifacts/ags-fertility.
      confidence: observed
    - name: Migration rollback capability
      detail: Forward-only SQL, applied manually. No down migrations, no CI application step.
      confidence: observed
    - name: Global rate limiting
      detail: Rate limiter is per-isolate only; no cross-isolate enforcement.
      evidence: workers/src/middleware/rateLimit.ts
      confidence: observed

