# ─────────────────────────────────────────────
# DELIVERY MODEL
# ─────────────────────────────────────────────
delivery_model:
  description: >
    Layered work-item hierarchy: Company → Business Unit → Platform → Product →
    Portfolio → Roadmap → Phase → Wave → Epic → Sprint → Story → Task.
    WEF v1.1 (Workforce Execution Framework) governs all execution.
    confidence: observed (ADR-015, ADR-017, AI_PLATFORM_ROADMAP.md)

  layers:
    Phase:
      description: >
        Top-level product delivery grouping. Phases 0–4 for Concierge;
        Phases A–K for AI Platform.
      example: "Phase 2 — Patient Workflow Platform"
      evidence: ROADMAP.md

    Wave:
      description: >
        Numbered delivery increment within a Phase. Waves contain one or more
        Epics and deliver a coherent product capability.
      example: "Wave 6 — Secure Document Upload & Consent Implementation"
      evidence: "ROADMAP.md, CHANGELOG.md, commit history"

    EPIC:
      description: >
        Named unit of engineering work within a Wave. Two notations observed:
        two-tier EPIC-NNN-NNN (e.g. EPIC-002-005) and single-tier EPIC-NNN
        (e.g. EPIC-004). Later EPICs use dot notation (EPIC-005.9) or plain
        numbers (EPIC-014, EPIC-015).
      example_two_tier: "EPIC-003-005: Workforce Orchestration Platform"
      example_single_tier: "EPIC-004 (3/6): WorkflowStore abstraction"
      example_dot: "EPIC-005.9: Execution Gateway"
      evidence: "commit history, TASKS.md, ROADMAP.md"

    GOV:
      description: >
        Governance framework items, parallel to product Epics.
        GOV-001 through GOV-004 observed.
      example: "GOV-002: Operational Governance & Phase 2 Kickoff"
      evidence: "commit history (GOV-002, GOV-004), NAMING_STANDARDS.md"

    Milestone:
      description: >
        M1–M9 milestones within an EPIC, used for large platform Epics.
      example: "M1 (trust persistence), M2 (checksum), M3 (signature verification)"
      evidence: HERMES_CORE_NIGHT_PROMPT.md

