immediate_known_blockers:
  note: >
    Full gap detail is in KNOWN_GAPS.yaml (if present) or derivable from
    discovery/C_platform_subsystems.md. Named here by category; do not
    duplicate detailed analysis.

  blockers:
    - id: blocker_clinic_routes_unguarded
      severity: HIGH
      description: >
        6 /clinic/* routes in production have no authentication guard.
        PR #3 (fix/clinic-route-auth-guard) is the fix — it is open and
        unmerged. Production is currently vulnerable.
      action_required: "Merge PR #3 immediately."
      evidence: "I_repo_activity.md — PR #3 description; branch fix/clinic-route-auth-guard"
      confidence: observed

    - id: blocker_authorization_engine_not_wired
      severity: HIGH
      description: >
        /api/v1/authorization/check and /api/v1/permissions routes throw
        at runtime in production. AUTHORIZATION_ENGINE is never constructed
        — it is referenced as env.AUTHORIZATION_ENGINE but no such engine
        class exists in the codebase. These 2 of the 11 trust routes are
        broken in production.
      action_required: >
        Implement and wire AuthorizationEngine, or remove the broken routes
        from the live router. Do not touch without understanding the
        full Trust runtime wiring in workers/src/platform/trust/ and
        workers/src/routes/trustRuntime.ts.
      evidence: "discovery/C_platform_subsystems.md Section 4 (Trust Runtime)"
      confidence: observed

    - id: blocker_epcl_was_wef_all_false
      severity: CRITICAL_IF_AUTONOMOUS_EXECUTION_NEEDED
      description: >
        All 6 EPCL feature flags and all 5 WAS feature flags default to
        false. The EPCL→WAS→WEF autonomous orchestration pipeline is
        entirely unreachable in production. WAS WEFDelegator is an explicit
        stub. Enabling any flag without first completing WEF integration
        (no execution engine exists) would result in simulated-only
        execution. Do not enable these flags without implementing real
        WEF delegation.
      action_required: >
        Do not touch EPCL/WAS/WEF flags until WEF execution engine is
        implemented (currently a TODO stub in wef-delegator.ts). This is
        a prerequisite for any autonomous platform execution.
      evidence: "discovery/C_platform_subsystems.md Sections 1–3, 16"
      confidence: observed

    - id: blocker_inmemory_data_loss
      severity: MEDIUM
      description: >
        Appointments, Messaging, Timeline, Credentials, and Release
        Management subsystems use in-memory engines (globalThis pattern
        or Maps). All data is lost on Worker restart. Cloudflare Workers
        are ephemeral — restarts happen on deployments and on idle timeout.
        Production users lose appointment and messaging data on any deploy.
      action_required: >
        Migrate Appointments, Messaging, and Timeline to D1-backed stores
        before enabling real patient traffic. Credentials and Release
        Management are internal-only and less urgent.
      evidence: "discovery/C_platform_subsystems.md Sections 9–14"
      confidence: observed

    - id: blocker_version_ts_stale
      severity: LOW
      description: >
        workers/src/version.ts exports SERVICE_VERSION = "1.1.0" but
        CHANGELOG latest entry is v1.6.0 (2026-08-01). The extract-version.sh
        script has not been run since v1.1.0 (commit 42377bd, 2026-07-30).
        Any service that reads SERVICE_VERSION for health checks or
        monitoring will report a stale version.
      action_required: "Run bash scripts/extract-version.sh to regenerate version.ts."
      evidence: "I_repo_activity.md Section 7 (version.ts cross-check)"
      confidence: observed

    - id: blocker_notification_delivery_simulated
      severity: MEDIUM
      description: >
        The Notification & Engagement Platform delivery engine simulates all
        external delivery (FCM/APNs for push, SES/SMTP for email, Twilio for
        SMS). No real messages are sent. Patients and clinics will not receive
        any push, email, or SMS notifications in production.
      action_required: >
        Implement real external service calls in delivery-engine.ts before
        enabling patient-facing notifications. Requires FCM, SES, and/or
        Twilio credentials and integration.
      evidence: "discovery/C_platform_subsystems.md Section 8"
      confidence: observed

    - id: blocker_stop_conditions
      severity: HIGH
      description: >
        CURRENT_SPRINT.md (root) carries active stop conditions:
        Do NOT deploy Production, Do NOT activate Bots, Do NOT onboard
        Clinics or Patients, Do NOT introduce new Epics, Do NOT activate
        future platform capabilities. These are standing governance
        directives from the Wave 9 sprint closure.
      action_required: >
        These stop conditions must be explicitly superseded by a Phase 3
        planning document before any of the listed actions are taken.
        A future AI session must not treat them as expired just because
        the sprint is marked Complete.
      evidence: "CURRENT_SPRINT.md (root, observed directly)"
      confidence: observed
