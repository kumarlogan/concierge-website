    branch: "fix/clinic-route-auth-guard"
    opened_date: "2026-08-03"
    opened_by: kumarlogan
    merged: false
    priority: HIGHEST
    priority_note: >
      SECURITY FIX — 6 unguarded clinic routes are currently reachable in
      production without clinic identity verification. This PR adds
      authentication guards to all /clinic/* routes. It has been open for
      ~24 hours with no review or merge. Until merged, unauthenticated
      access to clinic routes is possible in production.
    what_it_changes: >
      Adds clinic identity guards (equivalent to requirePermission or
      withClinicAuth) to 6 /clinic/* routes that currently have no
      authentication check. Closes a security gap in the running production
      system at api.agsynergy.ca.
    why_it_matters: >
      Clinic routes handle patient health data and clinic-side operations.
      Unguarded routes allow unauthenticated callers to access or mutate
      clinic resources. This is a P1/security-class defect.
    current_state: >
