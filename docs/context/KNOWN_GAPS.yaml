  - id: GAP-001
    severity: critical
    category: runtime_defect
    title: AUTHORIZATION_ENGINE is declared and called but never constructed
    detail: >-
      AUTHORIZATION_ENGINE appears in the Env type and is invoked by two live
      endpoints, but nothing ever instantiates it. Both endpoints will throw a
      runtime TypeError when called.
    affected:
      - POST /api/v1/authorization/check
      - GET /api/v1/permissions
    evidence: [workers/src/types/env.ts, workers/src/routes/trustRuntime.ts]
    resolution: FIXED — wired via thin adapter over DecisionEngine in wirePlatformEngines() (PRG-013)
    commit: 2fbb3c4
    status: RESOLVED
    consequence: Two authorization endpoints are hard-broken in production.
    recommendation: >-
      Either construct and wire the engine, or remove the endpoints and the Env
      declaration. Do not leave a declared-but-absent binding in the type.
    confidence: observed

  - id: GAP-002
    severity: critical
    category: schema_conflict
    title: The consents table is defined twice with incompatible schemas
    detail: >-
      `consents` is created in 0006_trust_runtime.sql and created again, with a
      wider and incompatible column set, in 0008_consent_engine.sql. Because both
      use IF NOT EXISTS, whichever ran first wins and the second definition's
      columns (patient_identity_id, status, resource_type, revoked_by, updated_at)
      never land in the live database.
    evidence: [workers/migrations/0006_trust_runtime.sql, workers/migrations/0008_consent_engine.sql]
    consequence: >-
      Code written against the 0008 schema will fail against the live table. Silent
      divergence between what migrations describe and what the database contains.
    recommendation: >-
      Inspect the live D1 schema to establish ground truth, then write a forward
      migration that reconciles the table to a single intended definition.
    confidence: observed

