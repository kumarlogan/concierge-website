  - id: GAP-006
    severity: high
    category: data_loss
    title: In-memory singletons shadow live D1 tables
    detail: >-
      ConsentEngine and DelegationEngine are module-level singletons backed by Map
      objects. The D1 `consents` and `delegations` tables exist but are not wired to
      them. Messaging, appointments, timeline, and document metadata are likewise
      in-memory. All of this data evaporates on Worker cold start.
    evidence:
      - workers/src/platform/trust/consent-engine.ts
      - workers/src/platform/trust/delegation-engine.ts
      - workers/src/platform/messaging/message-engine.ts
      - workers/src/platform/appointments/index.ts
    consequence: >-
      Consent grants and delegations — records with compliance significance in a
      clinical context — do not persist. Endpoints appear to work in testing and
      lose data in production.
    recommendation: >-
      Wire the trust engines to their existing D1 tables first, since those carry
      compliance weight. Then create a messages table and migrate messaging off
      globalThis.
    confidence: observed

