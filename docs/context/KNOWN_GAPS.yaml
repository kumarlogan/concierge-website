      fail-closed checks. Stack B, entered via executeCapability, bypasses all
      runtime guards and tenant enforcement.
    evidence: [docs/architecture/HERMES_PLATFORM_M1.md]
    consequence: Security posture depends on which code path a caller happens to take.
    recommendation: Route Stack B through the same guard, or delete it if Stack A supersedes it.
    confidence: observed

