openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AGS Fertility Concierge API
servers:
  - url: /api/v1
    description: API v1 base path
tags:
  - name: health
    description: Health operations
  - name: consultations
    description: Consultation request operations

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /consultations:
    post:
      operationId: submitConsultation
      tags: [consultations]
      summary: Submit a consultation request
      description: Submits a new consultation enquiry from an intended parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Consultation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationError"
        "409":
          description: Duplicate lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationError"

  /consultations/count:
    get:
      operationId: getConsultationCount
      tags: [consultations]
      summary: Get total consultation request count
      description: Returns the total number of consultation requests submitted
      responses:
        "200":
          description: Consultation count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationCount"

components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - service
        - version
        - environment
        - timestamp
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        environment:
          type: string
        timestamp:
          type: string

    ConsultationInput:
      type: object
      required:
        - name
        - email
        - phone
        - treatment_interest
      properties:
        name:
          type: string
          maxLength: 255
          description: Full name of the enquiring person
        email:
          type: string
          maxLength: 255
          description: Contact email address
        phone:
          type: string
          maxLength: 100
          description: Phone number
        treatment_interest:
          type: string
          maxLength: 500
          description: Treatment the person is interested in
        message:
          type: string
          maxLength: 2000
          description: Optional additional message or questions

    ConsultationSuccess:
      type: object
      required:
        - success
        - lead_id
        - status
        - message
      properties:
        success:
          type: boolean
        lead_id:
          type: string
        status:
          type: string
        message:
          type: string

    ConsultationError:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string

    ConsultationCount:
      type: object
      required:
        - count
      properties:
        count:
          type: integer